<!-- ระบบสุริยะและวงโคจร วางที่จุดศูนย์กลาง (0, 0.7, 0) ใต้ตำแหน่งสายตาผู้เล่น -->

  <a-entity id="left-controller" laser-controls="hand: left" cursor="rayOrigin: entity; fuse: false" raycaster="objects: .selectable; far: 25; showLine: true" line="color: #81d8ff; opacity: 0.8"></a-entity>
</a-entity>

<script>
const planets = window.PLANET_DATA || [];
const scene = document.querySelector('a-scene');
const exitVrBtn = document.getElementById('exit-vr-btn');
let hasVRController = false;

// ระบบจัดการปุ่ม VR ให้กดเข้าโหมด VR ได้ทุกเบราว์เซอร์ (ทั้งมีแว่น WebXR และไม่มีแว่น VR)
(function setupVRFallback() {
  const origEnterVR = scene.enterVR.bind(scene);
  const origExitVR = scene.exitVR.bind(scene);

  function requestCanvasFullscreen() {
    const target = scene.canvas || document.documentElement;
    const reqFs = target.requestFullscreen || target.webkitRequestFullscreen || target.mozRequestFullScreen || target.msRequestFullscreen;
    if (reqFs && !document.fullscreenElement) {
      try {
        const p = reqFs.call(target);
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) {}
    }
  }

  function enterFallbackVR() {
    if (scene.is('vr-mode')) return;
    scene.addState('vr-mode');
    if (scene.addFullScreenStyles) scene.addFullScreenStyles();
    requestCanvasFullscreen();
    scene.emit('enter-vr', { target: scene });
    if (scene.resize) scene.resize();
  }

  function exitFallbackVR() {
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
    if (scene.is('vr-mode') && !scene.xrSession) {
      scene.removeState('vr-mode');
      if (scene.removeFullScreenStyles) scene.removeFullScreenStyles();
      scene.emit('exit-vr', { target: scene });
      if (scene.resize) scene.resize();
    }
  }

  scene.enterVR = function (useAR, useOfferSession) {
    if (useOfferSession) {
      return origEnterVR(useAR, useOfferSession);
    }
    // ขอ Fullscreen ทันทีในจังหวะที่ผู้ใช้คลิกปุ่ม (ป้องกันเบราว์เซอร์บล็อกเมื่อ WebXR ปฏิเสธแบบ Async)
    if (!AFRAME.utils.device.checkHeadsetConnected()) {
      requestCanvasFullscreen();
    }
    try {
      const res = origEnterVR(useAR, false);
      if (res && typeof res.then === 'function') {
        return res.then((val) => {
          if (!scene.is('vr-mode')) enterFallbackVR();
          return val;
        }).catch(() => {
          enterFallbackVR();
        });
      }
      if (!scene.is('vr-mode')) enterFallbackVR();
      return Promise.resolve();
    } catch (err) {
      enterFallbackVR();
      return Promise.resolve();
    }
  };

  scene.exitVR = function () {
    if (scene.is('vr-mode') && !scene.xrSession) {
      exitFallbackVR();
      return Promise.resolve();
    }
    return origExitVR();
  };

  exitVrBtn.addEventListener('click', () => {
    scene.exitVR();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && scene.is('vr-mode') && !scene.xrSession) {
      exitFallbackVR();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && scene.is('vr-mode') && !scene.xrSession) {
      exitFallbackVR();
    }
  });

  function bindVRButton() {
    const vrContainer = document.querySelector('.a-enter-vr');
    if (vrContainer) vrContainer.classList.remove('a-hidden');
    const vrBtn = document.querySelector('.a-enter-vr-button');
    if (vrBtn && !vrBtn.dataset.boundFallback) {
      vrBtn.dataset.boundFallback = 'true';
      vrBtn.addEventListener('click', () => {
        requestCanvasFullscreen();
        setTimeout(() => {
          if (!scene.is('vr-mode')) enterFallbackVR();
        }, 150);
      });
    }
  }

  scene.addEventListener('loaded', bindVRButton);
  setTimeout(bindVRButton, 500);
})();

// Desktop uses mouse raycaster (`rayOrigin: mouse` on `a-scene`) so the normal OS pointer can click planets, cards, and quiz buttons anywhere on screen without locking or hiding the cursor.
// In VR mode: if a VR controller is connected, wand lasers handle selection; if headset-less VR is used, the center gaze ring (`#desktop-cursor`) is enabled.
const desktopCursor = document.querySelector('#desktop-cursor');
function syncInputMode(inVR) {
  if (inVR) {
    scene.setAttribute('raycaster', 'enabled', false);
    if (desktopCursor) {
      desktopCursor.setAttribute('visible', !hasVRController);
      desktopCursor.setAttribute('raycaster', 'enabled', !hasVRController);
    }
  } else {
    if (document.pointerLockElement && document.exitPointerLock) {
      try { document.exitPointerLock(); } catch (e) {}
    }
    scene.setAttribute('raycaster', 'enabled', true);
    if (desktopCursor) {
      desktopCursor.setAttribute('visible', false);
      desktopCursor.setAttribute('raycaster', 'enabled', false);
    }
  }
}
scene.addEventListener('enter-vr', () => {
  syncInputMode(true);
  exitVrBtn.style.display = 'block';
  document.querySelector('#vr-status').textContent = 'สถานะ: เข้าสู่ VR แล้ว';
});
scene.addEventListener('exit-vr', () => {
  syncInputMode(false);
  exitVrBtn.style.display = 'none';
  document.querySelector('#vr-status').textContent = 'สถานะ: Desktop';
});
['left-controller','right-controller'].forEach(id => {
  const controller = document.getElementById(id);
  controller.addEventListener('controllerconnected', () => {
    hasVRController = true;
    if (scene.is && scene.is('vr-mode')) syncInputMode(true);
    document.querySelector('#vr-status').textContent = 'Controller เชื่อมต่อ: ' + id;
  });
  controller.addEventListener('controllerdisconnected', () => {
    hasVRController = false;
    if (scene.is && scene.is('vr-mode')) syncInputMode(true);
    document.querySelector('#vr-status').textContent = 'Controller หลุดการเชื่อมต่อ: ' + id;
  });
});
const exhibits = document.querySelector('#exhibits');
const starField = document.querySelector('#stars');
// Deterministic star positions: no external textures or models required.
let seed=12987;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
for(let i=0;i<180;i++){
 const a=rand()*Math.PI*2, h=(rand()-.5)*Math.PI*.9, distance=38+rand()*16;
 const star=document.createElement('a-sphere');star.setAttribute('radius',.025+rand()*.055);
 star.setAttribute('position',`${Math.cos(h)*Math.sin(a)*distance} ${Math.sin(h)*distance+1.6} ${-Math.cos(h)*Math.cos(a)*distance}`);
 star.setAttribute('material','shader: flat; color: #b4c5eb; opacity: 0.8');starField.appendChild(star);
}
function make(tag,attrs,parent){const el=document.createElement(tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);parent.appendChild(el);return el;}
// Full-cycle prototype. All quiz items are placeholders, not final astronomy questions.
const uiRoot=document.querySelector('#ui-root');
const planetEntities=new Map();
let currentPlanet=null, quizState=null;
let isOrbitPaused = false;

function clearUI(){while(uiRoot.firstChild)uiRoot.removeChild(uiRoot.firstChild);}

// ฟังก์ชันวาดข้อความด้วย HTML5 Canvas เพื่อรองรับภาษาไทย 100% ใน A-Frame
// รองรับการกำหนด fontSize, fontFamily, lineHeight (ทั้งแบบสัดส่วน 1.38 และแบบพิกเซล 40), และ maxHeight (ย่อขนาดอัตโนมัติไม่ให้ข้อความล้นกรอบ)
function txt(parent, value, pos, width, color = '#e7faff', align = 'center', customStyle = {}) {
  const rawLines = String(value ?? '').split('\n');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontFamily = customStyle.fontFamily || '"Sarabun", "Kanit", "Tahoma", system-ui, sans-serif';
  const rawLineHeight = Number(customStyle.lineHeight) || 0;
  const maxWidth = 944;

  canvas.width = 1024;
  const initialFontSize = Number(customStyle.fontSize) > 0 ? Number(customStyle.fontSize) : 42;
  let fontSize = initialFontSize;
  const minFontSize = Number(customStyle.minFontSize) > 0 ? Number(customStyle.minFontSize) : 22;
  // รองรับทั้ง lineHeight แบบตัวคูณ (<= 5 เช่น 1.35) และแบบพิกเซล (> 5 เช่น 38, 44, 50)
  const lineRatio = rawLineHeight > 5 ? (rawLineHeight / initialFontSize) : (rawLineHeight > 0 ? rawLineHeight : 1.38);
  const maxCanvasHeight = (Number(customStyle.maxHeight) > 0 && Number(width) > 0)
    ? Math.floor(1024 * (Number(customStyle.maxHeight) / Number(width)))
    : 0;

  function wrapLines(size) {
    ctx.font = `bold ${size}px ${fontFamily}`;
    const wrapped = [];
    rawLines.forEach(rawLine => {
      if (ctx.measureText(rawLine).width <= maxWidth) {
        wrapped.push(rawLine);
      } else {
        let current = '';
        for (const ch of rawLine) {
          if (ctx.measureText(current + ch).width > maxWidth) {
            wrapped.push(current);
            current = ch;
          } else {
            current += ch;
          }
        }
        if (current) wrapped.push(current);
      }
    });
    return wrapped;
  }

  let lines = wrapLines(fontSize);
  let lineHeight = fontSize * lineRatio;

  if (maxCanvasHeight > 0) {
    while (fontSize > minFontSize && Math.ceil(lines.length * lineHeight + 32) > maxCanvasHeight) {
      fontSize -= 2;
      lineHeight = fontSize * lineRatio;
      lines = wrapLines(fontSize);
    }
  }

  canvas.height = Math.max(84, Math.ceil(lines.length * lineHeight + 32));
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = `bold ${fontSize}px ${fontFamily}`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.textAlign = align;

  const x = align === 'left' ? 40 : align === 'right' ? canvas.width - 40 : canvas.width / 2;
  const startY = (canvas.height - (lines.length - 1) * lineHeight) / 2;

  lines.forEach((line, i) => {
    ctx.fillText(line, x, startY + i * lineHeight);
  });

  const aspect = canvas.height / canvas.width;
  const planeHeight = width * aspect;

  let finalPos = formatVec3(pos, '0 0 0');
  if (!customStyle.centerAnchor) {
    if (align === 'left') {
      const parts = String(finalPos).trim().split(/\s+/).map(Number);
      parts[0] += width / 2;
      finalPos = parts.join(' ');
    } else if (align === 'right') {
      const parts = String(finalPos).trim().split(/\s+/).map(Number);
      parts[0] -= width / 2;
      finalPos = parts.join(' ');
    }
  }

  const el = make('a-plane', {
    position: finalPos,
    width: width,
    height: planeHeight,
    material: 'shader: flat; transparent: true; side: double; depthWrite: false'
  }, parent);

  const applyTexture = () => {
    const mesh = el.getObject3D('mesh');
    if (mesh && mesh.material) {
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      mesh.material.map = texture;
      mesh.material.transparent = true;
      mesh.material.needsUpdate = true;
    }
  };

  if (el.getObject3D('mesh')) {
    applyTexture();
  } else {
    el.addEventListener('loaded', applyTexture, { once: true });
  }

  return el;
}

function formatVec3(val, fallback = '0 0 0') {
  if (!val) return fallback;
  if (typeof val === 'string') return val.trim() || fallback;
  if (typeof val === 'object') {
    const x = Number(val.x) || 0;
    const y = Number(val.y) || 0;
    const z = Number(val.z) || 0;
    return `${x} ${y} ${z}`;
  }
  return fallback;
}

function parseVec3(val, fallback = [0, 0, 0]) {
  if (!val) return fallback.slice();
  if (typeof val === 'string') {
    const parts = val.trim().split(/\s+/).map(Number);
    return [parts[0] || 0, parts[1] || 0, parts[2] || 0];
  }
  if (typeof val === 'object') {
    return [Number(val.x) || 0, Number(val.y) || 0, Number(val.z) || 0];
  }
  return fallback.slice();
}

function button(parent,label,pos,width,height,fn,color='#155e75',hoverColor='#0891b2',customStyle={}){
 const opacity = (typeof customStyle.opacity === 'number') ? customStyle.opacity : 0.98;
 const textColor = customStyle.textColor || '#ffffff';
 const b=make('a-plane',{class:'selectable ui-button',width,height,position:formatVec3(pos,'0 0 0.035'),material:`shader: flat; color:${color}; opacity:${opacity}; side:double`},parent);
 if (customStyle.borderColor) {
   const bt = Number(customStyle.borderThickness) > 0 ? Number(customStyle.borderThickness) : 0.008;
   make('a-plane',{width:width+bt*2,height:height+bt*2,position:'0 0 -0.003',material:`shader: flat; color:${customStyle.borderColor}; opacity:${opacity}; side:double`},b);
 }
 txt(b,label,'0 0 0.012',width*.92,textColor,'center',customStyle);
 b.addEventListener('click',e=>{e.stopPropagation();if(!b.dataset.locked&&typeof fn==='function')fn();});
 b.addEventListener('mouseenter',()=>b.setAttribute('material',`shader: flat; color:${hoverColor}; opacity:1; side:double`));
 b.addEventListener('mouseleave',()=>b.setAttribute('material',`shader: flat; color:${color}; opacity:${opacity}; side:double`));
 return b;
}
function refreshRaycasters(){
  [scene, document.querySelector('#desktop-cursor'), document.getElementById('right-controller'), document.getElementById('left-controller')].forEach(el => {
    const rc = el && el.components && el.components.raycaster;
    if (rc && typeof rc.refreshObjects === 'function') rc.refreshObjects();
  });
}
function setPlanetSelection(on){planetEntities.forEach(({sphere})=>on?sphere.classList.add('selectable'):sphere.classList.remove('selectable'));refreshRaycasters();}
function openUI(){
 isOrbitPaused = true; // หยุดหมุนวงโคจรชั่วคราวเมื่อการ์ดเปิด
 uiRoot.setAttribute('visible',true);
 setPlanetSelection(false);
 setTimeout(refreshRaycasters, 0);
}
function closeUI(){
 clearUI();
 uiRoot.setAttribute('visible',false);
 currentPlanet=null;
 quizState=null;
 isOrbitPaused = false; // กลับมาหมุนวงโคจรต่อเมื่อปิดการ์ด
 setPlanetSelection(true);
 setTimeout(refreshRaycasters, 0);
}

// วาดแผงการ์ดพื้นฐาน รองรับการกำหนดขนาด พื้นหลัง ขอบ มุมตกแต่ง และตำแหน่งหัวข้อแยกแต่ละดวงดาว
// ให้ความสำคัญกับค่าที่กรอกในหมวด style ของไฟล์ดาวทันที และใช้ค่าจาก card เป็นโครงสร้าง/ค่าเสริม
function basePanel(title,subtitle='',style={},targetRoot=uiRoot,cardCfg={}){
 const w = Number(cardCfg.width) > 0 ? Number(cardCfg.width) : 1.78;
 const h = Number(cardCfg.height) > 0 ? Number(cardCfg.height) : 1.22;
 const bgCfg = cardCfg.background || {};
 const borderCfg = cardCfg.border || {};
 const headerCfg = cardCfg.header || {};

 const bg = style.panelBgColor || bgCfg.color || '#071827';
 const bgOpacity = (typeof bgCfg.opacity === 'number') ? bgCfg.opacity : 0.94;
 const border = style.panelBorderColor || borderCfg.color || '#22d3ee';
 const borderThickness = Number(borderCfg.thickness) > 0 ? Number(borderCfg.thickness) : 0.018;
 const borderOpacity = (typeof borderCfg.opacity === 'number') ? borderCfg.opacity : 1;
 const borderStyle = borderCfg.style || 'top-bottom';
 const tColor = style.titleColor || headerCfg.titleColor || '#a5f3fc';
 const subColor = style.subtitleColor || headerCfg.subtitleColor || '#c8e9f3';

 const glowColor = borderCfg.glowColor || (bgCfg.outerGlow ? (bgCfg.outerGlowColor || style.highlightColor || border) : '');
 if (glowColor) {
   const glowPad = Number(borderCfg.glowSpread || bgCfg.outerGlowSpread) > 0 ? Number(borderCfg.glowSpread || bgCfg.outerGlowSpread) : 0.06;
   const glowOp = borderCfg.glowOpacity || bgCfg.outerGlowOpacity || 0.18;
   make('a-plane',{width:w+glowPad,height:h+glowPad,position:'0 0 -0.006',material:`shader: flat; color:${glowColor}; opacity:${glowOp}; transparent:true; side:double`},targetRoot);
 }

 make('a-plane',{width:w,height:h,position:'0 0 0',material:`shader: flat; color:${bg}; opacity:${bgOpacity}; transparent:true; side:double`},targetRoot);

 if (bgCfg.image) {
   const bgImg = make('a-image',{src:bgCfg.image,width:w,height:h,position:'0 0 0.003',transparent:true,opacity:bgCfg.imageOpacity||0.22,side:'double'},targetRoot);
   bgImg.addEventListener('error',()=>bgImg.setAttribute('visible',false));
 }

 const halfH = h / 2 - borderThickness / 2;
 const halfW = w / 2 - borderThickness / 2;
 if (borderStyle !== 'none') {
   if (borderStyle === 'top-bottom' || borderStyle === 'all' || borderStyle === 'full' || borderStyle === 'frame' || borderStyle === 'corners') {
     make('a-plane',{width:w,height:borderThickness,position:`0 ${halfH} .008`,material:`shader: flat; color:${border}; opacity:${borderOpacity}; transparent:true; side:double`},targetRoot);
     make('a-plane',{width:w,height:borderThickness,position:`0 ${-halfH} .008`,material:`shader: flat; color:${border}; opacity:${borderOpacity}; transparent:true; side:double`},targetRoot);
   }
   if (borderStyle === 'all' || borderStyle === 'full' || borderStyle === 'frame') {
     make('a-plane',{width:borderThickness,height:h,position:`${-halfW} 0 .008`,material:`shader: flat; color:${border}; opacity:${borderOpacity}; transparent:true; side:double`},targetRoot);
     make('a-plane',{width:borderThickness,height:h,position:`${halfW} 0 .008`,material:`shader: flat; color:${border}; opacity:${borderOpacity}; transparent:true; side:double`},targetRoot);
   }
   if (borderStyle === 'corners' || Number(borderCfg.cornerSize) > 0) {
     const cSize = Number(borderCfg.cornerSize) > 0 ? Number(borderCfg.cornerSize) : 0.14;
     const cThick = borderThickness * 1.35;
     const cColor = style.panelBorderColor || borderCfg.cornerColor || borderCfg.accentColor || border;
     [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([sx,sy])=>{
       const cx = sx * (w/2 - cSize/2);
       const cy = sy * (h/2 - cThick/2);
       make('a-plane',{width:cSize,height:cThick,position:`${cx} ${cy} .011`,material:`shader: flat; color:${cColor}; opacity:${borderOpacity}; transparent:true; side:double`},targetRoot);
       const vx = sx * (w/2 - cThick/2);
       const vy = sy * (h/2 - cSize/2);
       make('a-plane',{width:cThick,height:cSize,position:`${vx} ${vy} .011`,material:`shader: flat; color:${cColor}; opacity:${borderOpacity}; transparent:true; side:double`},targetRoot);
     });
   }
 }

 if (headerCfg.show !== false) {
   const defaultTitleY = h / 2 - 0.13;
   const defaultSubY = defaultTitleY - 0.13;
   const titlePos = formatVec3(headerCfg.titlePos, `0 ${defaultTitleY.toFixed(3)} .02`);
   const subtitlePos = formatVec3(headerCfg.subtitlePos, `0 ${defaultSubY.toFixed(3)} .02`);
   const titleWidth = Number(headerCfg.titleWidth) > 0 ? Number(headerCfg.titleWidth) : Math.min(w * 0.82, 1.55);
   const subtitleWidth = Number(headerCfg.subtitleWidth) > 0 ? Number(headerCfg.subtitleWidth) : Math.min(w * 0.75, 1.35);
   const headerAlign = headerCfg.align || 'center';
   const titleFontSize = Number(style.fontSize) > 0 ? Math.round(Number(style.fontSize) * 1.15) : (headerCfg.titleFontSize || 46);
   const subFontSize = Number(style.fontSize) > 0 ? Math.round(Number(style.fontSize) * 0.92) : (headerCfg.subtitleFontSize || 38);
   const titleStyle = Object.assign({}, style, { fontSize: titleFontSize });
   const subStyle = Object.assign({}, style, { fontSize: subFontSize });

   const displayTitle = (headerCfg.title !== undefined && headerCfg.title !== '') ? headerCfg.title : (title || 'ยังไม่ได้ระบุชื่อดาว');
   const displaySub = (headerCfg.subtitle !== undefined) ? headerCfg.subtitle : subtitle;

   txt(targetRoot, displayTitle, titlePos, titleWidth, tColor, headerAlign, titleStyle);
   if (displaySub) txt(targetRoot, displaySub, subtitlePos, subtitleWidth, subColor, headerAlign, subStyle);

   if (headerCfg.showDivider) {
     const divY = (typeof headerCfg.dividerY === 'number') ? headerCfg.dividerY : (defaultSubY - 0.075);
     const divW = Number(headerCfg.dividerWidth) > 0 ? Number(headerCfg.dividerWidth) : w * 0.86;
     const divColor = style.panelBorderColor || headerCfg.dividerColor || border;
     make('a-plane',{width:divW,height:0.005,position:`0 ${divY} .015`,material:`shader: flat; color:${divColor}; opacity:0.65; side:double`},targetRoot);
   }
 }
}

// วาดโมเดล 3D และรูปภาพประกอบในการ์ด รองรับการปรับขนาด ตำแหน่ง และคำบรรยายแยกตามดาว
function planetImage(p, targetRoot=uiRoot, cardCfg={}){
 const mediaCfg = cardCfg.media || {};
 if (mediaCfg.show === false) return null;

 const w = Number(cardCfg.width) > 0 ? Number(cardCfg.width) : 1.78;
 const h = Number(cardCfg.height) > 0 ? Number(cardCfg.height) : 1.22;
 const layout = cardCfg.layout || 'horizontal';

 const defaultMediaPos = layout === 'vertical'
   ? `0 ${(h * 0.14).toFixed(3)} .035`
   : `${(-w * 0.29).toFixed(3)} .02 .035`;
 const mediaPos = formatVec3(mediaCfg.position, defaultMediaPos);
 const modelRadius = Number(mediaCfg.modelRadius) > 0 ? Number(mediaCfg.modelRadius) : (layout === 'vertical' ? 0.20 : 0.25);

 const color = p.color || '#64748b';
 const v = make('a-entity', { position: mediaPos }, targetRoot);
 if (mediaCfg.rotation) v.setAttribute('rotation', formatVec3(mediaCfg.rotation, '0 0 0'));

 const frameColor = p.style?.panelBorderColor || mediaCfg.frameColor;
 if (frameColor) {
   const frameR = modelRadius * 1.26;
   const [ox, oy, oz] = parseVec3(mediaCfg.modelOffset, [0, 0, 0]);
   make('a-ring',{'radius-inner':frameR-0.01,'radius-outer':frameR+0.01,position:`${ox} ${oy} ${(oz - 0.01).toFixed(3)}`,material:`shader: flat; color:${frameColor}; opacity:0.6; transparent:true; side:double`},v);
 }

 let previewSphere = null;
 if (mediaCfg.show3D !== false) {
   const isSun = p.id === 'sun';
   const mat = p.texture
     ? `shader: ${isSun ? 'flat' : 'standard'}; src: ${p.texture}; roughness: 0.8`
     : `shader: ${isSun ? 'flat' : 'standard'}; color: ${color}; roughness: 0.8`;
   previewSphere = make('a-sphere',{
     class: 'card-preview-sphere',
     radius: modelRadius,
     color: color,
     position: formatVec3(mediaCfg.modelOffset, '0 0 0'),
     segmentsWidth: 24,
     segmentsHeight: 18,
     material: mat,
     animation: 'property: rotation; to: 0 360 0; loop: true; dur: 28000; easing: linear'
   }, v);
   if (p.id === 'saturn' || p._fallbackId === 'saturn' || p.ringColor || mediaCfg.showRing || mediaCfg.ringRadius) {
     const rRadius = Number(mediaCfg.ringRadius) > 0 ? Number(mediaCfg.ringRadius) : modelRadius * 1.48;
     const rTube = Number(mediaCfg.ringTube) > 0 ? Number(mediaCfg.ringTube) : 0.025;
     const [ox, oy, oz] = parseVec3(mediaCfg.modelOffset, [0, 0, 0]);
     make('a-torus',{position:`${ox} ${oy} ${oz}`,radius:rRadius,'radius-tubular':rTube,rotation:mediaCfg.ringRotation||'70 0 0',color:mediaCfg.ringColor||p.ringColor||'#cdb98d'},v);
   }
 }

 const imgSrc = mediaCfg.imageSrc !== undefined ? mediaCfg.imageSrc : p.image;
 if (imgSrc && mediaCfg.showImage !== false) {
   const imgW = Number(mediaCfg.imageWidth) > 0 ? Number(mediaCfg.imageWidth) : 0.48;
   const imgH = Number(mediaCfg.imageHeight) > 0 ? Number(mediaCfg.imageHeight) : 0.48;
   const imgPos = formatVec3(mediaCfg.imageOffset, '0 0 .28');
   const image = make('a-image',{src:imgSrc,width:imgW,height:imgH,position:imgPos,transparent:true,side:'double'},v);
   image.addEventListener('error',()=>{image.setAttribute('visible',false);});
 }

 if (mediaCfg.showCaption !== false) {
   const [mx, my, mz] = parseVec3(mediaPos, [-0.52, 0.02, 0.035]);
   let capPos;
   if (mediaCfg.captionPos) {
     const [cx, cy, cz] = parseVec3(mediaCfg.captionPos, [0, -0.36, 0.02]);
     // หากระบุ x: 0 ใน captionPos ให้จัดอยู่ตรงใต้โมเดล (mx) โดยอัตโนมัติ
     const finalCapX = (Math.abs(cx) < 0.001 && layout === 'horizontal') ? mx : cx;
     capPos = `${finalCapX.toFixed(3)} ${(my + cy).toFixed(3)} ${Math.max(mz, cz).toFixed(3)}`;
   } else {
     capPos = `${mx.toFixed(3)} ${(my - modelRadius - 0.12).toFixed(3)} .04`;
   }
   const capWidth = Number(mediaCfg.captionWidth) > 0 ? Number(mediaCfg.captionWidth) : 0.72;
   const capText = mediaCfg.caption !== undefined ? mediaCfg.caption : (p.name ? `โมเดล 3D: ${p.name}` : 'ภาพประกอบใน assets/images');
   const capColor = p.style?.subtitleColor || p.style?.titleColor || mediaCfg.captionColor || '#67e8f9';
   const capStyle = Object.assign({}, p.style || {}, { fontSize: mediaCfg.captionFontSize || 34 });
   if (capText) txt(targetRoot, capText, capPos, capWidth, capColor, 'center', capStyle);
 }
 return previewSphere;
}

// วาดองค์ประกอบตกแต่งเสริมของการ์ด (Decorations)
function renderCardDecorations(p, targetRoot, cardCfg) {
  const decorations = Array.isArray(cardCfg.decorations) ? cardCfg.decorations : [];
  decorations.forEach(dec => {
    if (!dec || dec.enabled === false) return;
    const pos = formatVec3(dec.position, '0 0 0.02');
    const rot = formatVec3(dec.rotation, '0 0 0');
    const color = dec.color || p.style?.panelBorderColor || '#22d3ee';
    const opacity = (typeof dec.opacity === 'number') ? dec.opacity : 0.85;
    if (dec.type === 'text' && dec.text) {
      const style = Object.assign({}, p.style || {}, dec.fontSize ? { fontSize: dec.fontSize } : {});
      txt(targetRoot, dec.text, pos, Number(dec.width) || 0.8, color, dec.align || 'center', style);
    } else if (dec.type === 'ring') {
      make('a-ring', {
        position: pos,
        rotation: rot,
        'radius-inner': Number(dec.radiusInner) || 0.28,
        'radius-outer': Number(dec.radiusOuter) || 0.30,
        material: `shader: flat; color: ${color}; opacity: ${opacity}; transparent: true; side: double`
      }, targetRoot);
    } else if (dec.type === 'circle') {
      make('a-circle', {
        position: pos,
        rotation: rot,
        radius: Number(dec.radius) || 0.05,
        material: `shader: flat; color: ${color}; opacity: ${opacity}; transparent: true; side: double`
      }, targetRoot);
    } else if (dec.type === 'sphere') {
      make('a-sphere', {
        position: pos,
        radius: Number(dec.radius) || 0.03,
        material: `shader: flat; color: ${color}; opacity: ${opacity}; transparent: true`
      }, targetRoot);
    } else {
      make('a-plane', {
        position: pos,
        rotation: rot,
        width: Number(dec.width) || 0.2,
        height: Number(dec.height) || 0.01,
        material: `shader: flat; color: ${color}; opacity: ${opacity}; transparent: true; side: double`
      }, targetRoot);
    }
  });
}

// วาดเนื้อหาข้อมูลดาว รองรับทั้งแบบรายการเดียว (content) และแบบแบ่งหลายหมวดอิสระ (sections)
function renderCardContent(p, targetRoot, cardCfg) {
  const s = p.style || {};
  const w = Number(cardCfg.width) > 0 ? Number(cardCfg.width) : 1.78;
  const h = Number(cardCfg.height) > 0 ? Number(cardCfg.height) : 1.22;
  const layout = cardCfg.layout || 'horizontal';
  const sections = Array.isArray(cardCfg.sections) ? cardCfg.sections.filter(sec => sec && sec.enabled !== false) : [];

  if (sections.length > 0) {
    sections.forEach((sec, idx) => {
      const secW = Number(sec.width) > 0 ? Number(sec.width) : (layout === 'vertical' ? w * 0.84 : w * 0.50);
      const defaultSecPos = layout === 'vertical'
        ? `0 ${(0.0 - idx * 0.24).toFixed(3)} .03`
        : `${(-w * 0.05).toFixed(3)} ${(0.16 - idx * 0.26).toFixed(3)} .03`;
      const secPos = formatVec3(sec.position, defaultSecPos);
      const [sx, sy, sz] = parseVec3(secPos, [0, 0, 0.03]);
      const align = sec.align || 'left';
      const bullet = sec.bulletPrefix !== undefined ? sec.bulletPrefix : (sec.bullet !== undefined ? sec.bullet : '• ');

      if (sec.bgColor) {
        const boxH = Number(sec.boxHeight) > 0 ? Number(sec.boxHeight) : 0.22;
        const boxCenterX = align === 'left' ? sx + secW / 2 : (align === 'right' ? sx - secW / 2 : sx);
        make('a-plane', {
          position: `${boxCenterX} ${sy} ${(sz - 0.005).toFixed(3)}`,
          width: secW + (Number(sec.padding) || 0.04),
          height: boxH,
          material: `shader: flat; color: ${sec.bgColor}; opacity: ${sec.bgOpacity || 0.55}; transparent: true; side: double`
        }, targetRoot);
      }

      let bodyY = sy;
      if (sec.title) {
        const tStyle = Object.assign({}, s, { fontSize: sec.titleFontSize || Math.round((Number(s.fontSize) || 42) * 0.86) });
        txt(targetRoot, sec.title, `${sx} ${(sy + 0.075).toFixed(3)} ${sz}`, secW, s.titleColor || sec.titleColor || '#67e8f9', align, tStyle);
        bodyY = sy - 0.025;
      }

      const items = Array.isArray(sec.items) && sec.items.filter(Boolean).length
        ? sec.items.filter(Boolean).map(x => `${bullet}${x}`).join('\n')
        : (sec.text || '');
      if (items) {
        const bodyStyle = Object.assign({}, s, {
          fontSize: Number(s.fontSize) > 0 ? Number(s.fontSize) : (sec.fontSize || 36),
          lineHeight: sec.lineHeight || 1.32,
          maxHeight: sec.maxHeight || 0.42
        });
        txt(targetRoot, items, `${sx} ${bodyY.toFixed(3)} ${sz}`, secW, s.textColor || sec.color || '#ffffff', align, bodyStyle);
      }
    });
    return;
  }

  const contentCfg = cardCfg.content || {};
  if (contentCfg.show === false) return;

  const includeFacts = contentCfg.includeFacts !== false;
  const includeInfo = Boolean(contentCfg.includeInfo || contentCfg.showInfoSummary);
  const customFacts = (includeFacts && Array.isArray(p.facts) && p.facts.filter(Boolean).length) ? p.facts.filter(Boolean) : null;
  let facts = customFacts ? customFacts.slice() : (p.id === 'sun'
    ? ['ดวงอาทิตย์เป็นดาวฤกษ์', 'เป็นศูนย์กลางของระบบสุริยะ']
    : [p.info || 'รอเพิ่มข้อมูลของดาวดวงนี้', 'ข้อมูลเพิ่มเติมจะใส่ภายหลัง', 'ขนาดและระยะทาง', 'อุณหภูมิและองค์ประกอบ', 'ข้อเท็จจริงที่น่าสนใจ']);

  if (includeInfo && p.info && customFacts && !facts.includes(p.info)) {
    facts = [p.info, ...facts];
  } else if (!includeFacts && includeInfo && p.info) {
    facts = [p.info];
  }

  const bullet = contentCfg.bulletPrefix !== undefined ? contentCfg.bulletPrefix : (contentCfg.bullet !== undefined ? contentCfg.bullet : '• ');
  const align = contentCfg.align || (layout === 'vertical' ? 'left' : 'left');
  const defaultWidth = layout === 'vertical' ? w * 0.82 : w * 0.506;
  const contentW = Number(contentCfg.width) > 0 ? Number(contentCfg.width) : defaultWidth;
  const defaultPos = layout === 'vertical'
    ? `${(-contentW / 2).toFixed(3)} ${(-h * 0.10).toFixed(3)} .03`
    : `${(-w * 0.056).toFixed(3)} .08 .03`;
  const contentPos = formatVec3(contentCfg.position, defaultPos);
  const [cx] = parseVec3(contentPos, [0, 0, 0.03]);
  // หากในไฟล์ดาวระบุ position.x เป็นค่าบวก (เช่น x: 0.18 หรือ 0.24 ซึ่งเป็นจุดกึ่งกลางคอลัมน์ขวา) ให้วางกึ่งกลางแผ่นข้อความที่ x นั้นโดยตรง ไม่บวก width/2 ซ้ำ
  const isCenterColumnX = typeof contentCfg.position === 'object' || cx > 0.05;
  const defaultMaxH = layout === 'vertical' ? h * 0.36 : h * 0.52;

  const resolvedFontSize = Number(s.fontSize) > 0 ? Number(s.fontSize) : (Number(contentCfg.fontSize) > 0 ? Number(contentCfg.fontSize) : 42);
  const textStyle = Object.assign({}, s, {
    fontSize: resolvedFontSize,
    lineHeight: contentCfg.lineHeight || 1.35,
    maxHeight: contentCfg.maxHeight !== undefined ? contentCfg.maxHeight : defaultMaxH,
    centerAnchor: isCenterColumnX
  });

  txt(targetRoot, facts.map(x => `${bullet}${x}`).join('\n'), contentPos, contentW, s.textColor || contentCfg.color || '#ffffff', align, textStyle);
}

// วาดชุดปุ่มกดของการ์ด รองรับการเพิ่ม/ลบ/ย้าย/เปลี่ยนขนาด/เปลี่ยนสีปุ่มแยกอิสระต่อดาว
function renderCardButtons(p, targetRoot, cardCfg, previewSphere) {
  const s = p.style || {};
  const w = Number(cardCfg.width) > 0 ? Number(cardCfg.width) : 1.78;
  const h = Number(cardCfg.height) > 0 ? Number(cardCfg.height) : 1.22;
  const layout = cardCfg.layout || 'horizontal';
  const btnLayoutRaw = cardCfg.buttonLayout || {};
  const btnLayout = typeof btnLayoutRaw === 'string' ? { mode: btnLayoutRaw } : btnLayoutRaw;
  const hasSunQuiz = p.id === 'sun' && Array.isArray(window.PLANET_QUIZ?.sun) && window.PLANET_QUIZ.sun.some(x => x.q);

  let rawButtons = Array.isArray(cardCfg.buttons) ? cardCfg.buttons : null;
  if (!rawButtons) {
    rawButtons = [];
    if (p.id !== 'sun' || hasSunQuiz) {
      rawButtons.push({
        id: 'quiz',
        enabled: true,
        label: 'PLAY MINIGAME',
        action: 'quiz',
        position: layout === 'vertical' ? `0.28 ${(-h/2 + 0.14).toFixed(3)} 0.035` : '.35 -.39 .035',
        width: 0.72,
        height: 0.19,
        color: s.buttonColor || '#0e7490',
        hoverColor: s.buttonHoverColor || '#0891b2'
      });
    } else {
      txt(targetRoot, 'ดวงอาทิตย์คงพฤติกรรมเดิม\n(ใส่คำถามใน data/quiz/sun.js เพื่อเปิดมินิเกม)', '.31 -.36 .03', .82, '#bae6fd', 'center', s);
    }
    rawButtons.push({
      id: 'close',
      enabled: true,
      label: 'ปิดการ์ด',
      action: 'close',
      position: layout === 'vertical' ? `-0.34 ${(-h/2 + 0.14).toFixed(3)} 0.035` : '-.56 -.51 .035',
      width: 0.48,
      height: 0.15,
      color: s.closeButtonColor || '#334155',
      hoverColor: s.buttonHoverColor || '#0891b2'
    });
  }

  const activeButtons = rawButtons.filter(b => b && b.enabled !== false && b.visible !== false);
  const mode = btnLayout.mode || 'custom';
  const [baseX, baseY, baseZ] = parseVec3(btnLayout.position, [0, -h / 2 + 0.14, 0.035]);
  const spacing = (typeof btnLayout.spacing === 'number') ? btnLayout.spacing : 0.06;

  // คำนวณความกว้างรวมกรณีจัดเรียงปุ่มแนวนอนอัตโนมัติ (mode: 'horizontal')
  const totalHorizWidth = activeButtons.reduce((sum, b) => sum + (Number(b.width) || 0.52), 0) + Math.max(0, activeButtons.length - 1) * spacing;
  let cursorX = baseX - totalHorizWidth / 2;

  activeButtons.forEach((btnCfg, idx) => {
    const bw = Number(btnCfg.width) > 0 ? Number(btnCfg.width) : 0.56;
    const bh = Number(btnCfg.height) > 0 ? Number(btnCfg.height) : 0.15;
    let bPos = btnCfg.position;

    if (mode === 'horizontal' || !bPos) {
      const cx = cursorX + bw / 2;
      cursorX += bw + spacing;
      bPos = bPos && mode === 'custom' ? bPos : `${cx.toFixed(3)} ${baseY.toFixed(3)} ${baseZ.toFixed(3)}`;
    } else if (mode === 'vertical') {
      const cy = baseY - idx * (bh + spacing);
      bPos = `${baseX.toFixed(3)} ${cy.toFixed(3)} ${baseZ.toFixed(3)}`;
    }

    const isClose = btnCfg.action === 'close' || btnCfg.id === 'close';
    // ให้สีปุ่มที่กรอกในหมวด style (buttonColor / closeButtonColor / buttonHoverColor) มีผลทันที
    const bColor = isClose
      ? (s.closeButtonColor || btnCfg.color || '#334155')
      : (s.buttonColor || btnCfg.color || '#0e7490');
    const bHover = s.buttonHoverColor || btnCfg.hoverColor || '#0891b2';
    const bStyle = Object.assign({}, s, {
      fontSize: Number(s.fontSize) > 0 ? Number(s.fontSize) : (btnCfg.fontSize || 38),
      textColor: btnCfg.textColor || s.textColor || '#ffffff',
      borderColor: btnCfg.borderColor || s.panelBorderColor || '',
      borderThickness: btnCfg.borderThickness || 0,
      opacity: btnCfg.opacity
    });

    const handleAction = () => {
      if (typeof btnCfg.onClick === 'function') {
        btnCfg.onClick(p, window.SolarCardAPI);
      } else if (btnCfg.action === 'quiz' || btnCfg.action === 'minigame') {
        startQuiz(p);
      } else if (btnCfg.action === 'close' || btnCfg.action === 'back') {
        closeUI();
      } else if (btnCfg.action === 'spin') {
        if (previewSphere) triggerSpin(previewSphere);
        planetEntities.forEach(item => {
          if (item.data === p && item.sphere) triggerSpin(item.sphere);
        });
      }
    };

    button(targetRoot, btnCfg.label || 'BUTTON', bPos, bw, bh, handleAction, bColor, bHover, bStyle);
  });
}

// API กลางสำหรับให้ไฟล์ดาวแต่ละดวงเรียกใช้หรือปรับแต่งการ์ดได้อย่างอิสระ
window.SolarCardAPI = {
  make,
  txt,
  button,
  basePanel,
  planetImage,
  renderCardDecorations,
  renderCardContent,
  renderCardButtons,
  startQuiz,
  closeUI,
  triggerSpin
};

function showInfo(p){
 const s = p.style || {};
 const cardCfg = p.card || {};
 currentPlanet = p;
 openUI();
 clearUI();

 // สร้าง Container เฉพาะของการ์ดดาวดวงนี้ เพื่อปรับตำแหน่ง (X,Y,Z), ระยะห่าง, การหมุน และขนาดแยกอิสระ
 let cardPos = formatVec3(cardCfg.position, '0 0 0');
 if (typeof cardCfg.distance === 'number' && cardCfg.distance > 0 && !cardCfg.position) {
   const dz = (1.8 - cardCfg.distance).toFixed(3);
   cardPos = `0 0 ${dz}`;
 }
 const cardRot = formatVec3(cardCfg.rotation, '0 0 0');
 const cardScale = typeof cardCfg.scale === 'number' && cardCfg.scale > 0
   ? `${cardCfg.scale} ${cardCfg.scale} ${cardCfg.scale}`
   : formatVec3(cardCfg.scale, '1 1 1');

 const cardContainer = make('a-entity', {
   id: 'planet-card-root',
   position: cardPos,
   rotation: cardRot,
   scale: cardScale
 }, uiRoot);

 if (cardCfg.lookAtCamera) {
   cardContainer.setAttribute('look-at-camera', '');
 }

 // หากไฟล์ดาวกำหนดฟังก์ชัน renderCard เอง ให้ใช้ฟังก์ชันนั้นวาดการ์ดได้ทันที
 if (typeof p.renderCard === 'function') {
   p.renderCard(cardContainer, p, window.SolarCardAPI);
   return;
 }

 basePanel(p.name, p.en, s, cardContainer, cardCfg);
 renderCardDecorations(p, cardContainer, cardCfg);
 const previewSphere = planetImage(p, cardContainer, cardCfg);
 renderCardContent(p, cardContainer, cardCfg);
 renderCardButtons(p, cardContainer, cardCfg, previewSphere);
 setTimeout(refreshRaycasters, 0);
}
function startQuiz(p){
 currentPlanet=p;
 const qKey = p.id || p._fallbackId || '';
 quizState={index:0,answers:[],questions:(window.PLANET_QUIZ?.[qKey]||[])};
 if(!quizState.questions.length){showInfo(p);return;}
 renderQuestion();
}
function renderQuestion(){
 const s=currentPlanet?.style||{};
 clearUI();const q=quizState.questions[quizState.index];basePanel(`${currentPlanet.name||'ดาว'} · MINIGAME`,`คำถาม ${quizState.index+1} / ${quizState.questions.length}`,s);
 txt(uiRoot,q.q||`รอเพิ่มคำถามข้อที่ ${quizState.index+1}`,'0 .20 .03',1.35,s.textColor||'#ffffff','center',s);
 q.options.forEach((opt,i)=>button(uiRoot,opt||`ตัวเลือก ${String.fromCharCode(65+i)}`,`0 ${.015-i*.17} .035`,1.43,.135,()=>answerQuestion(i),s.buttonColor||'#164e63',s.buttonHoverColor||'#0891b2',s));
 button(uiRoot,'ออกจากมินิเกม','0 -.53 .035',.85,.12,()=>showInfo(currentPlanet),s.closeButtonColor||'#334155',s.buttonHoverColor||'#0891b2',s);
 setTimeout(refreshRaycasters, 0);
}
function answerQuestion(selected){if(!quizState||quizState.answers[quizState.index])return;const q=quizState.questions[quizState.index];quizState.answers[quizState.index]={selected,correct:q.correct};renderFeedback();}
function renderFeedback(){
 const s=currentPlanet?.style||{};
 clearUI();const i=quizState.index,q=quizState.questions[i],a=quizState.answers[i],ok=a.selected===q.correct;
 const selText=q.options[a.selected]||`ตัวเลือก ${String.fromCharCode(65+a.selected)}`;
 const corText=q.options[q.correct]||`ตัวเลือก ${String.fromCharCode(65+q.correct)}`;
 basePanel(ok?'ตอบถูกต้อง':'คำตอบยังไม่ถูก',`คำถาม ${i+1} / ${quizState.questions.length}`,s);
 txt(uiRoot,`คำตอบของคุณ: ${selText}`,'0 .20 .03',1.35,s.textColor||'#ffffff','center',s);
 txt(uiRoot,`เฉลย: ${corText}`,'0 .06 .03',1.35,s.titleColor||'#67e8f9','center',s);
 txt(uiRoot,q.explanation||'รอเพิ่มคำอธิบายเฉลย','0 -.10 .03',1.35,'#dbeafe','center',s);
 button(uiRoot,i===quizState.questions.length-1?'ดูผลคะแนน':'ไปข้อถัดไป','0 -.43 .035',.95,.17,()=>{if(quizState.index<quizState.questions.length-1){quizState.index++;renderQuestion();}else renderResults();},s.buttonColor||'#0e7490',s.buttonHoverColor||'#0891b2',s);
 setTimeout(refreshRaycasters, 0);
}
function renderResults(){
 const s=currentPlanet?.style||{};
 clearUI();const score=quizState.answers.reduce((s,a)=>s+(a.selected===a.correct?1:0),0);
 basePanel('ผลมินิเกม',`${currentPlanet.name||'ดาว'} · คะแนน ${score} / ${quizState.questions.length}`,s);
 const review=quizState.questions.map((q,i)=>`${i+1}. ${quizState.answers[i].selected===q.correct?'ถูก':'ผิด'} · เฉลย ${q.options[q.correct]||`ตัวเลือก ${String.fromCharCode(65+q.correct)}`}`).join('\n');
 txt(uiRoot,review,'0 .06 .03',1.35,s.textColor||'#ffffff','center',s);
 button(uiRoot,'กลับสู่ระบบสุริยะ','0 -.46 .035',1.22,.17,closeUI,s.buttonColor||'#0e7490',s.buttonHoverColor||'#0891b2',s);
 setTimeout(refreshRaycasters, 0);
}

// สเกลขนาดดาวเปรียบเทียบที่สมจริงแต่คลิกง่ายใน VR และระยะวงโคจร/ความเร็วโคจรที่นุ่มนวลไม่เวียนหัว
const REALISTIC_SCALES = {
  sun:     { radius: 1.15, orbitRadius: 0,    orbitSpeed: 0 },
  mercury: { radius: 0.14, orbitRadius: 2.2,  orbitSpeed: 0.14 },
  venus:   { radius: 0.24, orbitRadius: 3.0,  orbitSpeed: 0.11 },
  earth:   { radius: 0.25, orbitRadius: 3.9,  orbitSpeed: 0.09 },
  mars:    { radius: 0.18, orbitRadius: 4.8,  orbitSpeed: 0.075 },
  jupiter: { radius: 0.68, orbitRadius: 6.2,  orbitSpeed: 0.055 },
  saturn:  { radius: 0.56, orbitRadius: 7.8,  orbitSpeed: 0.042 },
  uranus:  { radius: 0.38, orbitRadius: 9.2,  orbitSpeed: 0.032 },
  neptune: { radius: 0.36, orbitRadius: 10.5, orbitSpeed: 0.025 }
};
const PLANET_ORDER = ['sun', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];

// เอฟเฟกต์หมุนดาว 2 รอบเมื่อคลิกเลือก
function triggerSpin(el) {
  el.removeAttribute('animation__spin');
  el.setAttribute('animation__spin', 'property: rotation; to: 0 720 0; dur: 2500; easing: easeOutQuad');
}

planets.forEach((p, i) => {
  const fallbackKey = PLANET_ORDER[i] || `planet-${i}`;
  p._fallbackId = fallbackKey;
  const id = p.id || fallbackKey;
  const isSun = (i === 0 || p.id === 'sun');
  const s = p.style || {};
  const color = p.color || (isSun ? '#ffbe32' : '#64748b');

  const scaleDef = REALISTIC_SCALES[id] || REALISTIC_SCALES[fallbackKey] || {
    radius: isSun ? 1.15 : 0.30,
    orbitRadius: isSun ? 0 : 2.2 + i * 1.0,
    orbitSpeed: isSun ? 0 : Math.max(0.02, 0.14 - i * 0.012)
  };

  const radius = (typeof p.radius === 'number' && p.radius > 0) ? p.radius : scaleDef.radius;
  const orbitRadius = isSun ? 0 : ((typeof p.orbitRadius === 'number' && p.orbitRadius > 0) ? p.orbitRadius : scaleDef.orbitRadius);
  const orbitSpeed = isSun ? 0 : ((typeof p.orbitSpeed === 'number') ? p.orbitSpeed : scaleDef.orbitSpeed);

  // วาดเส้นวงโคจรสำหรับดาวที่มี orbitRadius > 0
  if (orbitRadius > 0) {
    make('a-ring', {
      'radius-inner': orbitRadius - 0.012,
      'radius-outer': orbitRadius + 0.012,
      rotation: '90 0 0',
      material: 'shader: flat; color: #38bdf8; opacity: 0.25; transparent: true; side: double'
    }, exhibits);
  }

  // ดวงอาทิตย์ (i === 0 หรือ p.id === 'sun') วางที่พิกัดศูนย์กลาง 0 0 0 เสมอ ส่วนดาวอื่นสุ่มมุมเริ่มต้นรอบวงโคจร
  const initAngle = isSun ? 0 : Math.random() * Math.PI * 2;
  const x = isSun ? 0 : Math.cos(initAngle) * orbitRadius;
  const z = isSun ? 0 : Math.sin(initAngle) * orbitRadius;

  const group = make('a-entity', { position: isSun ? '0 0 0' : `${x} 0 ${z}` }, exhibits);

  const sphere = make('a-sphere', {
    class: 'selectable',
    radius: radius,
    color: color,
    segmentsWidth: 28,
    segmentsHeight: 20
  }, group);

  if (p.texture) sphere.setAttribute('material', `shader: standard; src: ${p.texture}; roughness: 0.8`);
  else if (isSun) sphere.setAttribute('material', `shader: flat; color: ${color}`);
  else sphere.setAttribute('material', `shader: standard; color: ${color}; roughness: 0.7`);

  const highlight = make('a-sphere', {
    radius: radius * 1.10,
    material: `shader: flat; color: ${s.highlightColor || '#6cd7ff'}; opacity: 0.16; transparent: true; side: back`,
    visible: false
  }, group);

  if (id === 'saturn' || fallbackKey === 'saturn' || p.ringColor) {
    make('a-torus', {
      radius: radius * 1.65,
      'radius-tubular': 0.045,
      'segments-radial': 8,
      'segments-tubular': 48,
      rotation: '70 0 0',
      color: p.ringColor || '#cdb98d'
    }, group);
  }

  const label = make('a-entity', { position: `0 ${radius + 0.22} 0`, visible: false }, group);
  txt(label, p.name || `ดาวดวงที่ ${i + 1}`, '0 0 0', 1.35, s.titleColor || '#a5f3fc', 'center', s);
  label.setAttribute('look-at-camera', '');

  sphere.addEventListener('mouseenter', () => {
    highlight.setAttribute('visible', true);
    label.setAttribute('visible', true);
  });
  sphere.addEventListener('mouseleave', () => {
    highlight.setAttribute('visible', false);
    label.setAttribute('visible', false);
  });
  sphere.addEventListener('click', () => {
    triggerSpin(sphere);
    const isUiOpen = uiRoot.getAttribute('visible') === true || uiRoot.getAttribute('visible') === 'true';
    if (!isUiOpen) showInfo(p);
  });

  planetEntities.set(p.id ? `${p.id}-${i}` : `planet-${i}`, {
    sphere, group, label, highlight,
    data: p, orbitRadius, orbitSpeed, angle: initAngle
  });
});

// ลูปคำนวณการหมุนวงโคจรและการหมุนรอบตัวเองผ่าน A-Frame tick เพื่อให้ทำงานในโหมด WebXR / แว่น VR ได้ 100%
AFRAME.registerComponent('solar-orbits', {
  tick: function (time, timeDelta) {
    const dt = Math.min((timeDelta || 16) / 1000, 0.1);
    planetEntities.forEach((item) => {
      if (!isOrbitPaused && item.orbitRadius > 0 && item.group.object3D) {
        item.angle += item.orbitSpeed * dt;
        const x = Math.cos(item.angle) * item.orbitRadius;
        const z = Math.sin(item.angle) * item.orbitRadius;
        item.group.object3D.position.set(x, 0, z);
      }
      if (item.sphere.object3D) {
        item.sphere.object3D.rotation.y += dt * 0.5;
      }
    });
  }
});
exhibits.setAttribute('solar-orbits', '');

AFRAME.registerComponent('look-at-camera',{tick:function(){const camera=document.querySelector('a-camera');if(camera)this.el.object3D.lookAt(camera.object3D.getWorldPosition(new THREE.Vector3()));}});
</script>
