<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Odyssey VR — Modular Prototype 05</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="data/planets/sun.js"></script>
<script src="data/planets/mercury.js"></script>
<script src="data/planets/venus.js"></script>
<script src="data/planets/earth.js"></script>
<script src="data/planets/mars.js"></script>
<script src="data/planets/jupiter.js"></script>
<script src="data/planets/saturn.js"></script>
<script src="data/planets/uranus.js"></script>
<script src="data/planets/neptune.js"></script>
<script src="data/quiz/sun.js"></script>
<script src="data/quiz/mercury.js"></script>
<script src="data/quiz/venus.js"></script>
<script src="data/quiz/earth.js"></script>
<script src="data/quiz/mars.js"></script>
<script src="data/quiz/jupiter.js"></script>
<script src="data/quiz/saturn.js"></script>
<script src="data/quiz/uranus.js"></script>
<script src="data/quiz/neptune.js"></script>
<style>body{margin:0}#help{position:fixed;top:12px;left:12px;color:white;background:#101827c9;padding:12px 16px;border-radius:10px;font:14px system-ui;z-index:2;pointer-events:none}#help small{color:#b7c8e0}</style>
</head>
<body>
<div id="help"><b>SOLAR ODYSSEY VR · Modular Prototype 05</b><br><small>Desktop: ลากเมาส์เพื่อมอง · คลิกดาว/ปุ่ม<br>VR: ใช้วิธีเข้า VR เดิม · Controller + Trigger<br>ข้อมูลและคำถามเป็นตัวอย่างชั่วคราว<br><span id="vr-status">สถานะ: รอเข้า VR</span></small></div>
<a-scene background="color: #000006" renderer="antialias: true; colorManagement: true" vr-mode-ui="enabled: true">
<a-entity id="stars"></a-entity>
<a-entity id="exhibits"></a-entity>
<a-entity id="rig" position="0 0 0">
  <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false">
    <a-cursor id="desktop-cursor" raycaster="objects: .selectable; far: 12" fuse="false" material="color: #ffffff; shader: flat; opacity: 1; depthTest: false" geometry="primitive: ring; radiusInner: 0.010; radiusOuter: 0.020"></a-cursor>
    <a-entity id="ui-root" position="0 0 -1.8" visible="false"></a-entity>
  </a-camera>
  <a-entity id="right-controller" laser-controls="hand: right" cursor="rayOrigin: entity; fuse: false" raycaster="objects: .selectable; far: 12; showLine: true" line="color: #81d8ff; opacity: 0.8"></a-entity>
  <a-entity id="left-controller" laser-controls="hand: left" cursor="rayOrigin: entity; fuse: false" raycaster="objects: .selectable; far: 12; showLine: true" line="color: #81d8ff; opacity: 0.8"></a-entity>
</a-entity>
<a-entity light="type: ambient; color: #ffffff; intensity: 0.95"></a-entity>
<a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="-2 4 3"></a-entity>
</a-scene>
<script>
const planets = window.PLANET_DATA;
const scene = document.querySelector('a-scene');
// Camera gaze is for desktop only. In VR, selection is made with the wand laser.
scene.addEventListener('enter-vr', () => {
  document.querySelector('#desktop-cursor').setAttribute('raycaster', 'enabled', false);
  document.querySelector('#vr-status').textContent = 'สถานะ: เข้าสู่ VR แล้ว';
});
scene.addEventListener('exit-vr', () => {
  document.querySelector('#desktop-cursor').setAttribute('raycaster', 'enabled', true);
  document.querySelector('#vr-status').textContent = 'สถานะ: Desktop';
});
['left-controller','right-controller'].forEach(id => {
  const controller = document.getElementById(id);
  controller.addEventListener('controllerconnected', () => {
    document.querySelector('#vr-status').textContent = 'Controller เชื่อมต่อ: ' + id;
  });
  controller.addEventListener('controllerdisconnected', () => {
    document.querySelector('#vr-status').textContent = 'Controller หลุดการเชื่อมต่อ: ' + id;
  });
});
const exhibits = document.querySelector('#exhibits');
const starField = document.querySelector('#stars');
// Deterministic star positions: no external textures or models required.
let seed=12987;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
for(let i=0;i<180;i++){
 const a=rand()*Math.PI*2, h=(rand()-.5)*Math.PI*.9, distance=38+rand()*16;
 const star=document.createElement('a-sphere');star.setAttribute('radius',.025+rand()*.055);
 star.setAttribute('position',`${Math.cos(h)*Math.sin(a)*distance} ${Math.sin(h)*distance+1.6} ${-Math.cos(h)*Math.cos(a)*distance}`);
 star.setAttribute('material','shader: flat; color: #b4c5eb; opacity: 0.8');starField.appendChild(star);
}
function make(tag,attrs,parent){const el=document.createElement(tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);parent.appendChild(el);return el;}
// Full-cycle prototype. All quiz items are placeholders, not final astronomy questions.
const uiRoot=document.querySelector('#ui-root');
const planetEntities=new Map();
let currentPlanet=null, quizState=null;
function clearUI(){while(uiRoot.firstChild)uiRoot.removeChild(uiRoot.firstChild);}

// ฟังก์ชันวาดข้อความด้วย HTML5 Canvas เพื่อรองรับภาษาไทย 100% ใน A-Frame
function txt(parent, value, pos, width, color = '#e7faff', align = 'center', customStyle = {}) {
  const rawLines = String(value).split('\n');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontSize = customStyle.fontSize || 42;
  const fontFamily = customStyle.fontFamily || '"Sarabun", "Kanit", "Tahoma", system-ui, sans-serif';
  const lineHeight = fontSize * 1.38;
  const maxWidth = 944;

  canvas.width = 1024;
  ctx.font = `bold ${fontSize}px ${fontFamily}`;

  // ตัดบรรทัดอัตโนมัติกรณีข้อความยาวเกินกรอบ
  const lines = [];
  rawLines.forEach(rawLine => {
    if (ctx.measureText(rawLine).width <= maxWidth) {
      lines.push(rawLine);
    } else {
      let current = '';
      for (const ch of rawLine) {
        if (ctx.measureText(current + ch).width > maxWidth) {
          lines.push(current);
          current = ch;
        } else {
          current += ch;
        }
      }
      if (current) lines.push(current);
    }
  });

  canvas.height = Math.max(96, Math.ceil(lines.length * lineHeight + 32));
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = `bold ${fontSize}px ${fontFamily}`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.textAlign = align;

  const x = align === 'left' ? 40 : align === 'right' ? canvas.width - 40 : canvas.width / 2;
  const startY = (canvas.height - (lines.length - 1) * lineHeight) / 2;

  lines.forEach((line, i) => {
    ctx.fillText(line, x, startY + i * lineHeight);
  });

  const aspect = canvas.height / canvas.width;
  const planeHeight = width * aspect;

  let finalPos = pos;
  if (align === 'left') {
    const parts = pos.split(' ').map(Number);
    parts[0] += width / 2;
    finalPos = parts.join(' ');
  }

  const el = make('a-plane', {
    position: finalPos,
    width: width,
    height: planeHeight,
    material: 'shader: flat; transparent: true; side: double; depthWrite: false'
  }, parent);

  const applyTexture = () => {
    const mesh = el.getObject3D('mesh');
    if (mesh && mesh.material) {
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      mesh.material.map = texture;
      mesh.material.transparent = true;
      mesh.material.needsUpdate = true;
    }
  };

  if (el.getObject3D('mesh')) {
    applyTexture();
  } else {
    el.addEventListener('loaded', applyTexture, { once: true });
  }

  return el;
}

function button(parent,label,pos,width,height,fn,color='#155e75',hoverColor='#0891b2',customStyle={}){
 const b=make('a-plane',{class:'selectable ui-button',width,height,position:pos,material:`shader: flat; color:${color}; opacity:0.98; side:double`},parent);
 txt(b,label,'0 0 0.012',width*.92,'#ffffff','center',customStyle);
 b.addEventListener('click',e=>{e.stopPropagation();if(!b.dataset.locked)fn();});
 b.addEventListener('mouseenter',()=>b.setAttribute('material',`shader: flat; color:${hoverColor}; opacity:1; side:double`));
 b.addEventListener('mouseleave',()=>b.setAttribute('material',`shader: flat; color:${color}; opacity:0.98; side:double`));
 return b;
}
function setPlanetSelection(on){planetEntities.forEach(({sphere})=>on?sphere.classList.add('selectable'):sphere.classList.remove('selectable'));}
function openUI(){uiRoot.setAttribute('visible',true);setPlanetSelection(false);}
function closeUI(){clearUI();uiRoot.setAttribute('visible',false);currentPlanet=null;quizState=null;setPlanetSelection(true);}
function basePanel(title,subtitle='',style={}){
 const bg=style.panelBgColor||'#071827';
 const border=style.panelBorderColor||'#22d3ee';
 const tColor=style.titleColor||'#a5f3fc';
 const subColor=style.subtitleColor||'#c8e9f3';
 make('a-plane',{width:1.78,height:1.22,position:'0 0 0',material:`shader: flat; color:${bg}; opacity:0.94; side:double`},uiRoot);
 make('a-plane',{width:1.78,height:.018,position:'0 .60 .008',material:`shader: flat; color:${border}; side:double`},uiRoot);
 make('a-plane',{width:1.78,height:.018,position:'0 -.60 .008',material:`shader: flat; color:${border}; side:double`},uiRoot);
 txt(uiRoot,title||'ยังไม่ได้ระบุชื่อดาว','0 .48 .02',1.35,tColor,'center',style);
 if(subtitle)txt(uiRoot,subtitle,'0 .34 .02',1.25,subColor,'center',style);
}
function planetImage(p){
 const color=p.color||'#64748b';
 const v=make('a-entity',{position:'-.52 .02 .035'},uiRoot);
 const mat=p.texture?`shader: standard; src:${p.texture}; roughness:.8`:`shader: standard; color:${color}; roughness:.8`;
 make('a-sphere',{radius:.25,color:color,segmentsWidth:24,segmentsHeight:18,material:mat},v);
 if(p.id==='saturn'||p.ringColor)make('a-torus',{radius:.37,'radius-tubular':.025,rotation:'70 0 0',color:p.ringColor||'#cdb98d'},v);
 if(p.image){
   const image=make('a-image',{src:p.image,width:.48,height:.48,position:'0 0 .28',transparent:true,side:'double'},v);
   image.addEventListener('error',()=>{image.setAttribute('visible',false);});
 }
 txt(uiRoot,'ภาพประกอบใน assets/images','-.52 -.35 .04',.72,p.style?.titleColor||'#67e8f9','center',p.style||{});
}
function showInfo(p){
 const s=p.style||{};
 currentPlanet=p;openUI();clearUI();basePanel(p.name,p.en,s);planetImage(p);
 const customFacts=Array.isArray(p.facts)&&p.facts.filter(Boolean).length?p.facts.filter(Boolean):null;
 const facts=customFacts||(p.id==='sun'?['ดวงอาทิตย์เป็นดาวฤกษ์','เป็นศูนย์กลางของระบบสุริยะ']:[p.info||'รอเพิ่มข้อมูลของดาวดวงนี้','ข้อมูลเพิ่มเติมจะใส่ภายหลัง','ขนาดและระยะทาง','อุณหภูมิและองค์ประกอบ','ข้อเท็จจริงที่น่าสนใจ']);
 txt(uiRoot,facts.map(x=>'• '+x).join('\n'),'-.10 .08 .03',.90,s.textColor||'#ffffff','left',s);
 const hasSunQuiz=p.id==='sun'&&Array.isArray(window.PLANET_QUIZ?.sun)&&window.PLANET_QUIZ.sun.some(x=>x.q);
 if(p.id!=='sun'||hasSunQuiz)button(uiRoot,'PLAY MINIGAME','.35 -.39 .035',.72,.19,()=>startQuiz(p),s.buttonColor||'#0e7490',s.buttonHoverColor||'#0891b2',s);
 else txt(uiRoot,'ดวงอาทิตย์คงพฤติกรรมเดิม\n(ใส่คำถามใน data/quiz/sun.js เพื่อเปิดมินิเกม)','.31 -.36 .03',.82,'#bae6fd','center',s);
 button(uiRoot,'ปิดการ์ด','-.56 -.51 .035',.48,.15,closeUI,s.closeButtonColor||'#334155',s.buttonHoverColor||'#0891b2',s);
}
function startQuiz(p){currentPlanet=p;quizState={index:0,answers:[],questions:(window.PLANET_QUIZ[p.id]||[])};if(!quizState.questions.length){showInfo(p);return;}renderQuestion();}
function renderQuestion(){
 const s=currentPlanet?.style||{};
 clearUI();const q=quizState.questions[quizState.index];basePanel(`${currentPlanet.name||'ดาว'} · MINIGAME`,`คำถาม ${quizState.index+1} / ${quizState.questions.length}`,s);
 txt(uiRoot,q.q||`รอเพิ่มคำถามข้อที่ ${quizState.index+1}`,'0 .20 .03',1.35,s.textColor||'#ffffff','center',s);
 q.options.forEach((opt,i)=>button(uiRoot,opt||`ตัวเลือก ${String.fromCharCode(65+i)}`,`0 ${.015-i*.17} .035`,1.43,.135,()=>answerQuestion(i),s.buttonColor||'#164e63',s.buttonHoverColor||'#0891b2',s));
 button(uiRoot,'ออกจากมินิเกม','0 -.53 .035',.85,.12,()=>showInfo(currentPlanet),s.closeButtonColor||'#334155',s.buttonHoverColor||'#0891b2',s);
}
function answerQuestion(selected){if(!quizState||quizState.answers[quizState.index])return;const q=quizState.questions[quizState.index];quizState.answers[quizState.index]={selected,correct:q.correct};renderFeedback();}
function renderFeedback(){
 const s=currentPlanet?.style||{};
 clearUI();const i=quizState.index,q=quizState.questions[i],a=quizState.answers[i],ok=a.selected===q.correct;
 const selText=q.options[a.selected]||`ตัวเลือก ${String.fromCharCode(65+a.selected)}`;
 const corText=q.options[q.correct]||`ตัวเลือก ${String.fromCharCode(65+q.correct)}`;
 basePanel(ok?'ตอบถูกต้อง':'คำตอบยังไม่ถูก',`คำถาม ${i+1} / ${quizState.questions.length}`,s);
 txt(uiRoot,`คำตอบของคุณ: ${selText}`,'0 .20 .03',1.35,s.textColor||'#ffffff','center',s);
 txt(uiRoot,`เฉลย: ${corText}`,'0 .06 .03',1.35,s.titleColor||'#67e8f9','center',s);
 txt(uiRoot,q.explanation||'รอเพิ่มคำอธิบายเฉลย','0 -.10 .03',1.35,'#dbeafe','center',s);
 button(uiRoot,i===quizState.questions.length-1?'ดูผลคะแนน':'ไปข้อถัดไป','0 -.43 .035',.95,.17,()=>{if(quizState.index<quizState.questions.length-1){quizState.index++;renderQuestion();}else renderResults();},s.buttonColor||'#0e7490',s.buttonHoverColor||'#0891b2',s);
}
function renderResults(){
 const s=currentPlanet?.style||{};
 clearUI();const score=quizState.answers.reduce((s,a)=>s+(a.selected===a.correct?1:0),0);
 basePanel('ผลมินิเกม',`${currentPlanet.name||'ดาว'} · คะแนน ${score} / ${quizState.questions.length}`,s);
 const review=quizState.questions.map((q,i)=>`${i+1}. ${quizState.answers[i].selected===q.correct?'ถูก':'ผิด'} · เฉลย ${q.options[q.correct]||`ตัวเลือก ${String.fromCharCode(65+q.correct)}`}`).join('\n');
 txt(uiRoot,review,'0 .06 .03',1.35,s.textColor||'#ffffff','center',s);
 button(uiRoot,'กลับสู่ระบบสุริยะ','0 -.46 .035',1.22,.17,closeUI,s.buttonColor||'#0e7490',s.buttonHoverColor||'#0891b2',s);
}
planets.forEach((p,i)=>{
 const radius=p.radius||0.38;
 const color=p.color||'#64748b';
 const s=p.style||{};
 const angle=(-90+i*360/planets.length)*Math.PI/180;
 const x=Math.cos(angle)*4.2,z=Math.sin(angle)*4.2;
 const group=make('a-entity',{position:`${x} 1.7 ${z}`},exhibits);
 const sphere=make('a-sphere',{class:'selectable',radius:radius,color:color,segmentsWidth:28,segmentsHeight:20,animation:'property: rotation; to: 0 360 0; loop: true; dur: 110000; easing: linear'},group);
 if(p.texture)sphere.setAttribute('material',`shader: standard; src: ${p.texture}; roughness: 0.8`);
 else if(p.id==='sun')sphere.setAttribute('material',`shader: flat; color: ${color}`);
 const highlight=make('a-sphere',{radius:radius*1.10,material:`shader: flat; color: ${s.highlightColor||'#6cd7ff'}; opacity: 0.16; transparent: true; side: back`,visible:false},group);
 if(p.id==='saturn'||p.ringColor)make('a-torus',{radius:radius*1.65,'radius-tubular':.045,'segments-radial':8,'segments-tubular':48,rotation:'70 0 0',color:p.ringColor||'#cdb98d'},group);
 const label=make('a-entity',{position:`0 ${radius+.22} 0`,visible:false},group);
 txt(label, p.name||`ดาวดวงที่ ${i+1}`, '0 0 0', 1.35, s.titleColor||'#a5f3fc', 'center', s);
 label.setAttribute('look-at-camera','');
 sphere.addEventListener('mouseenter',()=>{highlight.setAttribute('visible',true);label.setAttribute('visible',true);});
 sphere.addEventListener('mouseleave',()=>{highlight.setAttribute('visible',false);label.setAttribute('visible',false);});
 sphere.addEventListener('click',()=>{if(!uiRoot.getAttribute('visible'))showInfo(p);});
 planetEntities.set(p.id||`planet-${i}`,{sphere,group,label,highlight});
});
AFRAME.registerComponent('look-at-camera',{tick:function(){const camera=document.querySelector('a-camera');if(camera)this.el.object3D.lookAt(camera.object3D.getWorldPosition(new THREE.Vector3()));}});
</script>
</body></html>
